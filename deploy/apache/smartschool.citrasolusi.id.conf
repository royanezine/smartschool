# ============================================================
# SmartSchool - smartschool.citrasolusi.id (Apache2)
# Frontend (Next.js)    : http://127.0.0.1:3000
# Backend API (Express) : http://127.0.0.1:5000  -> diakses via /api
#
# PENTING (order ProxyPass):
#   - /.well-known/acme-challenge/ harus DICABUT dari proxy (untuk SSL certbot)
#   - /api didaftarkan SEBELUM / agar request API tidak tertangkap frontend
#
# Setup SSL: jalankan setup-ssl.sh -> certbot --apache akan membuat
# VirtualHost :443 (salinan konfigurasi di bawah) + redirect http->https.
# ============================================================

<VirtualHost *:80>
    ServerName smartschool.citrasolusi.id

    ProxyPreserveHost On

    # --- Pengecualian challenge Let's Encrypt (harus sebelum ProxyPass /) ---
    ProxyPass /.well-known/acme-challenge/ !
    Alias /.well-known/acme-challenge/ /var/www/certbot/

    <Directory /var/www/certbot>
        Options -Indexes
        Require all granted
        AllowOverride None
    </Directory>

    # --- Backend API (Express port 5000) ---
    # /api      -> http://127.0.0.1:5000/
    # /api/xyz  -> http://127.0.0.1:5000/xyz
    ProxyPass /api http://127.0.0.1:5000/
    ProxyPassReverse /api http://127.0.0.1:5000/

    # --- Frontend (Next.js port 3000) ---
    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    ProxyTimeout 300

    # --- WebSocket / streaming (Next.js) ---
    RewriteEngine on
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/?(.*) ws://127.0.0.1:3000/$1 [P,L]

    # --- Batas ukuran upload (50MB) ---
    LimitRequestBody 52428800

    # --- Logging ---
    ErrorLog ${APACHE_LOG_DIR}/smartschool_error.log
    CustomLog ${APACHE_LOG_DIR}/smartschool_access.log combined
</VirtualHost>

