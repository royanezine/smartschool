# SmartSchool - smartschool.citrasolusi.id
# Frontend (Next.js)  : http://127.0.0.1:3006
# Backend API (Express): http://127.0.0.1:5000  -> diakses via /api

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name smartschool.citrasolusi.id;

    # Acme challenge untuk Let's Encrypt (webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name smartschool.citrasolusi.id;

    ssl_certificate     /etc/letsencrypt/live/smartschool.citrasolusi.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smartschool.citrasolusi.id/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # ============ Frontend (Next.js di port 3000) ============
    location / {
        proxy_pass http://127.0.0.1:3006;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Dukungan WebSocket/streaming (diperlukan Next.js)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # ============ Backend API (Express di port 5000) ============
    # /api        -> http://127.0.0.1:5000/
    # /api/xyz    -> http://127.0.0.1:5000/xyz
    location = /api {
        return 301 /api/;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5000/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # Request body besar untuk upload file
        client_max_body_size 50M;
    }
}